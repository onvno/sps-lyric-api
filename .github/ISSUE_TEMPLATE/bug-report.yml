name: Bug 反馈
description: 报告部署、浏览、审核或图片下载问题
title: "[Bug] "
body:
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、浏览器、Node.js 或 Docker 版本、代码版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 实际结果、日志或截图
      description: 请隐藏口令、私人数据和完整歌词。
