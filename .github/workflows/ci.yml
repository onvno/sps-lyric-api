name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run db:release -- --version ci-demo
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lyric-ci .
      - name: Smoke test with an isolated demo database
        run: |
          docker run -d --name lyric-ci -p 127.0.0.1:18789:8787 lyric-ci
          trap 'docker logs lyric-ci; docker rm -f lyric-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18789/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          node -e "const h=require('/tmp/health.json'); if(!h.ok || h.database.entries!==20 || h.adminMode) process.exit(1)"
          docker exec lyric-ci test -f skills/curate-lyric-lines/scripts/prepare-review-batch.mjs
